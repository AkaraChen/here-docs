  <title>Global Ban's Process Workflow</title>
  <g id="svg_2">
   <text xml:space="preserve" text-anchor="middle" font-family="serif" font-size="12" id="svg_3" stroke-linecap="null" stroke-linejoin="null" stroke-dasharray="null" stroke-width="0" stroke="#000000" fill="#000000" y="50" x="362">任何用户均可通过元维基
    <tspan dy="12" x="362" id="svg_1">上的讨论请求申请全域禁制</tspan></text>
  </g>
  <text fill="#000000" stroke="#000000" stroke-width="0" stroke-dasharray="null" stroke-linejoin="null" stroke-linecap="null" x="134" y="144" id="svg_4" font-size="12" font-family="serif" text-anchor="middle" xml:space="preserve">如果发起人未进行基本的举证，
   <tspan dy="12" x="134" id="svg_1">管理员或监管员可以直接关闭RFC。</tspan></text>
  <text fill="#000000" stroke="#000000" stroke-width="0" stroke-dasharray="null" stroke-linejoin="null" stroke-linecap="null" x="401" y="137" id="svg_5" font-size="12" font-family="serif" text-anchor="middle" xml:space="preserve">如果发起人已举证，讨论继续以取得共识。
   <tspan dy="12" x="401" id="svg_1">向用户及他活跃过的社群发出通知。</tspan></text>
  <text xml:space="preserve" text-anchor="middle" font-family="serif" font-size="12" id="svg_10" y="286" x="402" stroke-linecap="null" stroke-linejoin="null" stroke-dasharray="null" stroke-width="0" stroke="#000000" fill="#000000">元维基管理员或监管员将在讨论取
   <tspan dy="12" x="402" id="svg_1">得结论后关闭讨论，并判断共识。</tspan></text>
  <text fill="#000000" stroke="#000000" stroke-width="0" stroke-dasharray="null" stroke-linejoin="null" stroke-linecap="null" x="403" y="419" id="svg_15" font-size="12" font-family="serif" text-anchor="middle" xml:space="preserve">如果共识要求发出禁制，则向监管员请求
   <tspan dy="12" x="402" id="svg_1">全域锁定用户账户，并向本地管理员提供指示。</tspan></text>
