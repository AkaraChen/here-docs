name: Release

# Publishes package.json's version to npm when it is not there yet, through npm trusted publishing: GitHub's OIDC
# token instead of an npm token, with provenance. The npm package's trusted publisher is this repository's
# release.yml (docs/adr/npm-trusted-publishing.md). A push that does not change the version publishes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the v<version> tag
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.15.0 && npm --version
      - name: Version to publish
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "here-docs@$version" version >/dev/null 2>&1; then
            echo "here-docs@$version is already on npm; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A prerelease goes to the `next` dist-tag, a release to `latest`.
          case "$version" in *-*) echo "tag=next" ;; *) echo "tag=latest" ;; esac >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      - if: steps.version.outputs.publish == 'true'
        run: npm run smoke
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.tag }}"
      - if: steps.version.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
