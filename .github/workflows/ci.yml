name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  supported:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install with optional platform packages
        run: npm ci
      - run: npm test
      - name: Convert smoke from the repo build
        run: npm run smoke
      - name: Convert smoke after packed consumer install
        shell: bash
        run: |
          npm pack
          consumer="${RUNNER_TEMP}/here-docs-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y
          npm install "$GITHUB_WORKSPACE"/here-docs-*.tgz
          HERE_DOCS_SMOKE_PACKAGE=1 node "$GITHUB_WORKSPACE/scripts/smoke-convert.js"

  bun:
    name: ubuntu-24.04 / Bun
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - name: Convert smoke after packed consumer install under Bun (TypeScript source, no build)
        run: |
          npm pack
          consumer="${RUNNER_TEMP}/here-docs-bun-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          echo '{"name":"consumer","type":"module"}' > package.json
          bun add "$GITHUB_WORKSPACE"/here-docs-*.tgz
          HERE_DOCS_SMOKE_PACKAGE=1 bun "$GITHUB_WORKSPACE/scripts/smoke-convert.js"

  musl:
    name: alpine musl ${{ matrix.arch }} / Node ${{ matrix.node }}
    # JavaScript actions cannot run inside Alpine containers on arm64 runners, so check out on the
    # host and run every step in the container.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04, node: 22 }
          - { arch: x64, runner: ubuntu-24.04, node: 24 }
          - { arch: arm64, runner: ubuntu-24.04-arm, node: 22 }
          - { arch: arm64, runner: ubuntu-24.04-arm, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - name: Test and convert smoke in node:${{ matrix.node }}-alpine
        run: |
          docker run --rm -v "$PWD:/src:ro" node:${{ matrix.node }}-alpine sh -euc '
            cp -r /src /work && cd /work
            npm ci
            npm test
            npm run smoke
            npm pack
            mkdir /consumer && cd /consumer && npm init -y
            npm install /work/here-docs-*.tgz
            HERE_DOCS_SMOKE_PACKAGE=1 node /work/scripts/smoke-convert.js
          '

  unsupported-darwin-x64:
    name: macOS x64 fail-closed
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript without optional addons
        run: npm ci --ignore-scripts
      - run: npm run build
      - name: Engine startup must fail closed
        run: node scripts/smoke-unsupported.js
